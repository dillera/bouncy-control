# SwiftLint Configuration
# https://github.com/realm/SwiftLint

# Paths to include/exclude from linting
included:
  - BouncyControl

excluded:
  - Pods
  - BouncyControl/Resources
  - .build

# Rule Configuration
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - multiline_parameters
  - sorted_imports

disabled_rules:
  - trailing_whitespace

# Analyzer rules
analyzer_rules:
  - unused_declaration
  - unused_import

# Custom rule configurations
line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 50
  error: 100

cyclomatic_complexity:
  warning: 10
  error: 20

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 50
  excluded:
    - id
    - URL
    - url

# Reporter type
reporter: "xcode"
